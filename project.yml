name: Wanderlore
options:
  bundleIdPrefix: com.wanderlore
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  Wanderlore:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Wanderlore
    configFiles:
      Debug: Configs/Base.xcconfig
      Release: Configs/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wanderlore.app
        INFOPLIST_FILE: Wanderlore/Resources/Info.plist
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: 5.10
        ENABLE_PREVIEWS: YES

  WanderloreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WanderloreTests
    settings:
      base:
        SWIFT_VERSION: 5.10
    dependencies:
      - target: Wanderlore

  WanderloreUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WanderloreUITests
    settings:
      base:
        SWIFT_VERSION: 5.10
    dependencies:
      - target: Wanderlore
